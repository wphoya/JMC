<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>상품 카탈로그</title>
  <!-- CSV 파싱 라이브러리 (쉼표, 줄바꿈이 포함된 상품 설명 안전 처리) -->
  <script src="https://cloudflare.com"></script>
  <style>
    :root {
      --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #111827;
      --sub-text: #6b7280;
      --accent: #2563eb;
      --border: #e5e7eb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 24px 20px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 { font-size: 1.5rem; font-weight: 700; }
    header p { font-size: 0.9rem; color: var(--sub-text); margin-top: 4px; }

    .container {
      max-width: 1100px;
      margin: 32px auto;
      padding: 0 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.06);
    }
    .card-img-wrap {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #f3f4f6;
      overflow: hidden;
    }
    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .card-body { padding: 16px; flex: 1; display: flex; flex-direction: column; }
    .card-title { font-size: 1.05rem; font-weight: 600; margin-bottom: 6px; }
    .card-price { font-size: 1.1rem; font-weight: 700; color: var(--accent); margin-bottom: 8px; }
    .card-desc {
      font-size: 0.875rem;
      color: var(--sub-text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* 상세 보기 모달 */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-backdrop.active { display: flex; }
    .modal {
      background: var(--card-bg);
      border-radius: 16px;
      max-width: 820px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      position: relative;
    }
    @media (max-width: 720px) {
      .modal { grid-template-columns: 1fr; }
    }
    .close-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.9);
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      z-index: 2;
    }
    .gallery { padding: 20px; background: #f9fafb; display: flex; flex-direction: column; gap: 12px; }
    .main-img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 10px;
      background: #e5e7eb;
    }
    .thumbs { display: flex; gap: 8px; overflow-x: auto; }
    .thumbs img {
      width: 56px;
      height: 56px;
      object-fit: cover;
      border-radius: 6px;
      cursor: pointer;
      border: 2px solid transparent;
      opacity: 0.65;
    }
    .thumbs img.active { border-color: var(--accent); opacity: 1; }
    .modal-info { padding: 28px 24px; display: flex; flex-direction: column; }
    .modal-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 10px; }
    .modal-price { font-size: 1.35rem; font-weight: 700; color: var(--accent); margin-bottom: 18px; }
    .modal-desc {
      font-size: 0.95rem;
      color: #374151;
      white-space: pre-line;
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }
    .status { text-align: center; padding: 60px 20px; color: var(--sub-text); }
  </style>
</head>
<body>

  <header>
    <h1>상품 쇼룸</h1>
    <p>원하시는 상품을 클릭하시면 상세 이미지와 설명을 보실 수 있습니다.</p>
  </header>

  <main class="container">
    <div id="status" class="status">상품 목록을 불러오는 중입니다...</div>
    <div id="product-grid" class="grid"></div>
  </main>

  <!-- 상세 모달 -->
  <div id="modal-backdrop" class="modal-backdrop" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <button class="close-btn" onclick="forceCloseModal()">✕</button>
      <div class="gallery">
        <img id="modal-main-img" class="main-img" src="" alt="상품 이미지" />
        <div id="modal-thumbs" class="thumbs"></div>
      </div>
      <div class="modal-info">
        <h2 id="modal-title" class="modal-title"></h2>
        <div id="modal-price" class="modal-price"></div>
        <div id="modal-desc" class="modal-desc"></div>
      </div>
    </div>
  </div>

  <script>
    // ▼ 1단계에서 복사한 구글 스프레드시트 '웹에 게시(CSV)' 주소를 아래 따옴표 안에 붙여넣으세요.
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSNR1JpfQd9_izcj3a4G8kdPhKKqvHYmxYfy_ffmiCRYxjjC31MFU4hyG2ozNzHK_YJmRSkA9npHNZZ/pub?output=csv
";

    const gridEl = document.getElementById("product-grid");
    const statusEl = document.getElementById("status");
    let products = [];

    function formatPrice(value) {
      if (!value) return "";
      const num = Number(String(value).replace(/[^0-9.-]+/g, ""));
      return isNaN(num) || num === 0 ? value : num.toLocaleString("ko-KR") + "원";
    }

    function loadProducts() {
      Papa.parse(SHEET_CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          products = results.data.slice(0, 30); // 최대 30개 제한
          if (products.length === 0) {
            statusEl.textContent = "등록된 상품이 없습니다.";
            return;
          }
          statusEl.style.display = "none";
          renderGrid();
        },
        error: function() {
          statusEl.textContent = "데이터를 불러오지 못했습니다. 구글 시트 웹에 게시 URL을 확인해 주세요.";
        }
      });
    }

    function renderGrid() {
      gridEl.innerHTML = products.map((item, idx) => {
        const images = [item["이미지1"], item["이미지2"], item["이미지3"], item["이미지4"], item["이미지5"]].filter(Boolean);
        const thumb = images[0] || "https://placeholder.com";
        return `
          <div class="card" onclick="openModal(${idx})">
            <div class="card-img-wrap">
              <img src="${thumb}" alt="${item["상품명"] || ""}" loading="lazy" />
            </div>
            <div class="card-body">
              <div class="card-title">${item["상품명"] || "제목 없음"}</div>
              <div class="card-price">${formatPrice(item["가격"])}</div>
              <div class="card-desc">${item["설명"] || ""}</div>
            </div>
          </div>
        `;
      }).join("");
    }

    function openModal(idx) {
      const item = products[idx];
      const images = [item["이미지1"], item["이미지2"], item["이미지3"], item["이미지4"], item["이미지5"]].filter(Boolean);
      const validImages = images.length > 0 ? images : ["https://placeholder.com"];

      document.getElementById("modal-title").textContent = item["상품명"] || "";
      document.getElementById("modal-price").textContent = formatPrice(item["가격"]);
      document.getElementById("modal-desc").textContent = item["설명"] || "";

      const mainImg = document.getElementById("modal-main-img");
      const thumbsWrap = document.getElementById("modal-thumbs");
      mainImg.src = validImages[0];

      thumbsWrap.innerHTML = validImages.map((src, i) => `
        <img src="${src}" class="${i === 0 ? "active" : ""}" onclick="selectImage('${src}', this)" />
      `).join("");

      document.getElementById("modal-backdrop").classList.add("active");
    }

    function selectImage(src, el) {
      document.getElementById("modal-main-img").src = src;
      document.querySelectorAll("#modal-thumbs img").forEach(img => img.classList.remove("active"));
      el.classList.add("active");
    }

    function closeModal(e) {
      if (e.target.id === "modal-backdrop") forceCloseModal();
    }

    function forceCloseModal() {
      document.getElementById("modal-backdrop").classList.remove("active");
    }

    loadProducts();
  </script>
</body>
</html>
